name: Build Keyball Firmware

on:
  push:
    branches:
      - hk-master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      # 2. Python 3.9 をセットアップ
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 3. QMK CLI を最新版にアップグレード
      - name: Install QMK CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade qmk

      # 4. QMK Doctor（エラー無視）
      - name: Run QMK Doctor
        run: qmk doctor || true

      # 5. Keyball44 を via キーマップでビルド
      - name: Build Keyball44 Firmware
        run: |
          qmk compile -kb keyball/keyball44 -km via

      # 6. ビルドファイルをタイムスタンプ付きで dist に移動
      - name: Prepare firmware artifact
        run: |
          mkdir -p dist
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          for f in *.uf2; do
            mv "$f" "dist/keyball44_via_${TIMESTAMP}.uf2"
          done

      # 7. Artifact としてアップロード
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyball44-via
          path: dist/*

